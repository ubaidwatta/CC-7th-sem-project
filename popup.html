<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PhishGuard Lite</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="app">

    <header class="header">
      <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3l8 3v6c0 4.5-3.2 7.8-8 9-4.8-1.2-8-4.5-8-9V6l8-3z" />
        <path d="M8.5 12l2.5 2.5 4.5-5" />
      </svg>
      <div>
        <h1>PhishGuard <span>Lite</span></h1>
        <p class="tagline">URL risk analyzer</p>
      </div>
    </header>

    <section class="card site-card">
      <p class="label">Current website</p>
      <p id="domain" class="domain">Scanning…</p>
      <p id="url" class="url"></p>
      <span id="protocol" class="badge" hidden></span>
    </section>

    <section class="card status-card" id="statusCard" data-level="neutral">
      <div class="gauge">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <circle class="gauge-bg" cx="60" cy="60" r="52"></circle>
          <circle class="gauge-fill" id="gaugeFill" cx="60" cy="60" r="52"></circle>
        </svg>
        <div class="gauge-text">
          <span id="score">–</span>
          <small>/100</small>
        </div>
      </div>
      <div class="status-text">
        <p class="label">Security status</p>
        <p id="statusLabel" class="status-label">Scanning…</p>
        <p id="statusMessage" class="status-message"></p>
      </div>
    </section>

    <section class="card">
      <h2>Detected indicators <span id="count" class="count">0</span></h2>
      <ul id="indicators" class="indicators"></ul>
    </section>

    <div class="actions">
      <button id="scanBtn" class="btn primary" type="button">Scan again</button>
      <button id="historyBtn" class="btn secondary" type="button">History</button>
    </div>

    <p class="footer">Runs locally. Only the URL is analyzed.</p>
  </main>

  <script src="detector.js"></script>
  <script src="popup.js"></script>
</body>
</html>
